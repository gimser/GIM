<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>الماسح الضوئي - Supeco DLC Pro</title>
    <link rel="manifest" href="./manifest.json">

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/sidebar.css">
    <link rel="stylesheet" href="./styles/forms.css">

    <style>
        .scanner-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 80px);
            /* Adjust for header */
            background: black;
            overflow: hidden;
            border-radius: var(--radius);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-box {
            width: 280px;
            height: 280px;
            border: 2px solid var(--color-yellow);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
        }

        .scan-box::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: var(--color-error);
            box-shadow: 0 0 4px var(--color-error);
            animation: scanLine 2s infinite ease-in-out;
        }

        @keyframes scanLine {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateY(100px);
                opacity: 0;
            }
        }

        .scanner-controls {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 2rem;
            z-index: 10;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .manual-input {
            margin-top: 1rem;
            background: white;
            padding: 1rem;
            border-radius: var(--radius);
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">Supeco DLC Pro</div>
            <button class="btn-icon sidebar-close" style="color: white;">✕</button>

        <nav class="sidebar-nav">

            </a>
            <a href="scan.html" class="nav-item active">
                <span class="nav-icon">📷</span>
                <span>الماسح الضوئي</span>
            </a>
            <a href="settings.html" class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span>الإعدادات</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div class="flex items-center gap-4">
                <button class="btn-icon menu-toggle">☰</button>
                <h1>الماسح الضوئي</h1>
            </div>
        </header>

        <div class="scanner-container">
            <video id="cameraFeed" playsinline autoplay muted></video>
            <div class="scan-overlay">
                <div class="scan-box"></div>
            </div>
            <div class="scanner-controls">
                <button class="control-btn" id="btnFlash">⚡</button>
                <button class="control-btn" id="btnSwitchCamera">🔄</button>
            </div>
        </div>

        <div class="manual-input">
            <form id="manualInputForm" class="flex gap-2">
                <input type="number" name="barcode" class="form-control" placeholder="إدخال الباركود يدوياً..."
